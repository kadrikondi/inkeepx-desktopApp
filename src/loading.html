<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>InkeepX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }

  /* ── Logo ── */
  .logo {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #111111;
    margin-bottom: 18px;
    opacity: 0;
    transform: translateY(6px);
    animation: fadeUp 0.5s ease 0.1s forwards;
  }
  .logo span { color: #E8000D; }

  /* ── Greeting ── */
  .greet {
    font-size: 17px;
    font-weight: 600;
    color: #333333;
    margin-bottom: 6px;
    opacity: 0;
    transform: translateY(6px);
    animation: fadeUp 0.5s ease 0.25s forwards;
  }
  .greet span { color: #E8000D; }
  .tagline {
    font-size: 13px;
    color: #999999;
    margin-bottom: 36px;
    opacity: 0;
    transform: translateY(6px);
    animation: fadeUp 0.5s ease 0.4s forwards;
  }

  /* ── Spinner ── */
  .spinner-wrap {
    opacity: 0;
    animation: fadeUp 0.4s ease 0.3s forwards;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #f0f0f0;
    border-top-color: #E8000D;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }

  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Slow connection hint (appears after 12s) ── */
  .slow-hint {
    margin-top: 28px;
    font-size: 13px;
    color: #aaaaaa;
    text-align: center;
    max-width: 300px;
    line-height: 1.5;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .slow-hint.show { opacity: 1; }
</style>
</head>
<body>
  <div class="logo">Inkeep<span>X</span></div>
  <div class="greet" id="greet"></div>
  <div class="tagline">Modern Inventory &amp; POS Solutions</div>
  <div class="spinner-wrap">
    <div class="spinner"></div>
  </div>
  <div class="slow-hint" id="slowHint">Taking longer than usual — your connection may be slow&hellip;</div>

<script>
  setTimeout(function() {
    document.getElementById('slowHint').classList.add('show');
  }, 12000);

  (function() {
    var h = new Date().getHours();
    var g = (h >= 5 && h < 12) ? 'Good Morning'
          : (h >= 12 && h < 17) ? 'Good Afternoon'
          : (h >= 17 && h < 21) ? 'Good Evening'
          : 'Good Night';
    document.getElementById('greet').innerHTML =
      g + ', welcome to Inkeep<span>X</span>';
  })();
</script>
</body>
</html>
