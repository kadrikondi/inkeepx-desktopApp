<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InkeepX — Error</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-app-region: no-drag;
  }

  .logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #111111;
    margin-bottom: 48px;
  }
  .logo span { color: #E8000D; }

  /* ── Warning icon ── */
  .icon-wrap {
    width: 72px;
    height: 72px;
    margin-bottom: 32px;
  }
  .icon-wrap svg { width: 72px; height: 72px; opacity: 0.75; }

  .title {
    font-size: 18px;
    font-weight: 600;
    color: #111111;
    margin-bottom: 10px;
    text-align: center;
  }
  .sub {
    font-size: 14px;
    color: #888888;
    text-align: center;
    line-height: 1.6;
    max-width: 300px;
    margin-bottom: 8px;
  }
  .code {
    font-size: 12px;
    color: #cccccc;
    margin-bottom: 36px;
  }

  .btn-row { display: flex; gap: 12px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 26px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    outline: none;
  }
  .btn:active { transform: scale(0.97); }

  .btn.primary { background: #E8000D; color: #ffffff; }
  .btn.primary:hover { background: #c4000b; }

  .btn.secondary {
    background: #f4f4f4;
    color: #333333;
  }
  .btn.secondary:hover { background: #e8e8e8; }

  .btn svg { transition: transform 0.4s; }
  .btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hint {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: #cccccc;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Inkeep<span>X</span></div>

  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
            stroke="#E8000D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="9" x2="12" y2="13" stroke="#E8000D" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="17" r="1" fill="#E8000D"/>
    </svg>
  </div>

  <div class="title" id="title">Something Went Wrong</div>
  <div class="sub" id="sub">An unexpected error occurred while loading the page.</div>
  <div class="code" id="code"></div>

  <div class="btn-row">
    <button class="btn primary" id="retryBtn" onclick="retry()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
      </svg>
      Try Again
    </button>
    <button class="btn secondary" onclick="goHome()">Go to Home</button>
  </div>
</div>

<div class="hint">inkeepx.com</div>

<script>
  (function() {
    var code = new URLSearchParams(location.search).get('code') || '';
    var title = document.getElementById('title');
    var sub   = document.getElementById('sub');

    if (code === '404') {
      title.textContent = 'Page Not Found';
      sub.textContent   = 'The page you were looking for doesn’t exist or may have been moved.';
    } else if (code && code[0] === '5') {
      title.textContent = 'Server Problem';
      sub.textContent   = 'The server ran into a problem. This is usually temporary — please try again in a moment.';
    }
    if (code) document.getElementById('code').textContent = 'Error code: ' + code;
  })();

  function retry() {
    var btn = document.getElementById('retryBtn');
    btn.classList.add('spinning');
    btn.disabled = true;
    if (window.__electronBridge) window.__electronBridge.retry();
    setTimeout(function() {
      btn.classList.remove('spinning');
      btn.disabled = false;
    }, 3000);
  }

  function goHome() {
    if (window.__electronBridge) window.__electronBridge.goHome();
  }
</script>
</body>
</html>
